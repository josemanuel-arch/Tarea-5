# Lista de productos a vigilar (MÉXICO).
# Copia este archivo a "products.yaml" y edítalo con TUS URLs reales:
#   cp products.example.yaml products.yaml
#
# Abre el producto en la tienda y copia el link de la barra de direcciones.
#
# Campos:
#   name       -> cómo se llama en la alerta
#   url        -> link del PRODUCTO (no de la categoría)
#   retailer   -> amazon | walmart | liverpool | sanborns | sears | costco |
#                 juguetron | juguetibici | gameplanet | delsol | coppel |
#                 mercadolibre | shopify | woocommerce | generic
#   platform   -> (opcional) shopify | none. Fuerza o desactiva el modo Shopify.
#                 Con Shopify, el monitor usa el endpoint /products/<handle>.js
#                 (dato de stock oficial de la tienda; lo más fiable).
#   price      -> (opcional) solo informativo, para verlo en la alerta

defaults:
  interval_seconds: 120   # cada cuánto revisar cada producto (mín. 30)
  jitter_seconds: 40      # variación aleatoria, para no tener patrón fijo
  timeout_seconds: 20

products:
  # === Amazon México (preventa a MSRP; el mejor canal con protección) ===
  - name: "30th Celebration · Elite Trainer Box (Amazon MX preventa)"
    url: "https://www.amazon.com.mx/dp/B0H78BB9TY"
    retailer: amazon
    price: "$1,099 MXN · sale 16 sep 2026"

  - name: "Prismatic Evolutions · Elite Trainer Box (Amazon MX)"
    url: "https://www.amazon.com.mx/dp/B0DLPL7LC5"
    retailer: amazon
    price: "~$845 MXN"

  - name: "Prismatic Evolutions · Booster Bundle (Amazon MX)"
    url: "https://www.amazon.com.mx/dp/B0DN98RVZM"
    retailer: amazon
    price: "restock"

  # === Tienda especializada Shopify (detección por endpoint .js, muy fiable) ===
  # Pega la URL real del producto; el modo Shopify se activa solo al ver /products/.
  - name: "Wunderbox · (pega aquí el producto que quieras)"
    url: "https://www.wunderbox.com.mx/products/EL-HANDLE-REAL"
    retailer: shopify
    price: "preventa MSRP"

  # === Sanborns / Sears (big-box confiable, mismo catálogo) ===
  - name: "Sanborns · (pega aquí el producto)"
    url: "https://www.sanborns.com.mx/producto/ID/EL-SLUG"
    retailer: sanborns
    price: "MSRP, envío gratis"

  # === Gameplanet (WooCommerce; hace preventa) ===
  - name: "Gameplanet · (pega aquí el producto)"
    url: "https://gameplanet.com/producto/EL-SLUG/"
    retailer: gameplanet

  # === Señales personalizadas (si una tienda rara falla en la detección) ===
  # - name: "Tienda X"
  #   url: "https://tienda-x.mx/producto/y"
  #   retailer: generic
