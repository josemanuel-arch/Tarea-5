# 30th Celebration (Español 🇪🇸) — Amazon México · lista completa
# =============================================================================
# IMPORTANTE — lee esto o no funcionará:
#
# Los links que compartiste son cortos (https://link.amazon/XXXXX) y NO se pueden
# descargar directamente: hay que convertirlos al link COMPLETO del producto.
# Para cada producto, ábrelo una vez en el navegador y copia la URL final, que
# se ve así:   https://www.amazon.com.mx/dp/B0XXXXXXXX
# Pega esa URL en el campo `url:` de aquí abajo (reemplaza el link.amazon/...).
#
# OJO: Amazon MX bloquea seguido el scraping. Para Amazon, la alerta MÁS confiable
# es KEEPA (gratis) — ver el README y RECURSOS-MEXICO.md. Este archivo es la capa
# extra/personalizable; úsalo junto con Keepa, no en lugar de.
#
# Uso:  python3 monitor.py --config productos-30th-celebration.yaml
# =============================================================================

